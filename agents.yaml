# A2A agent registry.
#   url       A2A base URL of the agent. 127.0.0.1/localhost URLs are started by
#             `python -m orchestrator.cli serve`; any other host is treated as remote.
#   provider  anthropic | ollama | openai   (optional; default COMPLIANCE_PROVIDER, else anthropic)
#   model     model name           (optional; default COMPLIANCE_MODEL, else the provider default)
# Local and remote models are interchangeable per agent; the protocol does not change.
#   tool_mode  model | seeded (default model). model: the model calls its MCP tool (forced on the first turn for Anthropic);
#              a model that still does not call it is covered by the harness. seeded: the harness makes the call and
#              puts it in the conversation as the agent's own first step (native tool-call format); preferred for a
#              remote narrator because code obtains the canonical decision before sending it, and right for small local models.
#   include_regulations  true (default): the pinned regulation text from the rule pack is added to the system prompt.
#   templates  model | code (default model). Every failing check gets a loan-officer sheet (always written by code) and one examiner
#              paragraph per finding. model: the narrative call also rephrases a code-written draft of each paragraph; a paragraph
#              that fails the checks gets one retry, then code writes it. code: no paragraph is requested from the model (no extra
#              output, no extra request); code writes them all.
# concurrency: agent calls in flight at once for local (ollama) agents, which share one gate. 1 is right for a single local model.
#   `--concurrency N` on the command line is different: it caps every agent call at once and, alone, sets both widths.
# remote_concurrency: agent calls in flight at once for anthropic and openai agents, which share a second gate. A provider that
#   rate-limits (429) fails that role alone and the batch summary counts it; lower this value (or pass --remote-concurrency N) if that happens.
#   An agent's provider is its `provider` entry, else --provider, else COMPLIANCE_PROVIDER, else anthropic.
concurrency: 1
remote_concurrency: 8      # the highest width that ran clean on Anthropic Haiku (2, 4, 8 tried); see plans/parallelize/results.md
agents:
  hmda:      {url: "http://127.0.0.1:9101/"}
  ecoa:      {url: "http://127.0.0.1:9102/"}
  hvcre:     {url: "http://127.0.0.1:9103/"}
  hpml:      {url: "http://127.0.0.1:9104/"}
  trid:      {url: "http://127.0.0.1:9110/"}
  fzd:       {url: "http://127.0.0.1:9105/"}
  ybs:       {url: "http://127.0.0.1:9106/"}
  vmi:       {url: "http://127.0.0.1:9107/"}
  auditor:   {url: "http://127.0.0.1:9108/"}
  narrative: {url: "http://127.0.0.1:9109/"}

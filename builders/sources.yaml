      - {id: ecfr-12-cfr-1026-2, type: regulatory, citation: "12 CFR 1026.2", kind: ecfr_section, title: 12, part: 1026, section: "1026.2", snapshot: compliance_mcp/trid/pack/sources/12-cfr-1026-2.xml}
    spec_sites:
      mcp: [{url: "https://www.consumerfinance.gov/compliance/compliance-resources/mortgage-resources/tila-respa-integrated-disclosures/", note: "CFPB TRID compliance resources"}]
      agent: [{url: "https://www.consumerfinance.gov/compliance/compliance-resources/mortgage-resources/tila-respa-integrated-disclosures/", note: "CFPB TRID compliance resources"}]

  hmda:

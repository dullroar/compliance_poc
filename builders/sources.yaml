      - {id: ecfr-12-cfr-1003-appendix-b, type: regulatory, citation: "12 CFR part 1003 Appendix B (ethnicity, race and sex collection)", kind: ecfr_appendix, title: 12, part: 1003, appendix: "Appendix B to Part 1003", snapshot: compliance_mcp/hmda/pack/sources/12-cfr-1003-appendix-b.xml}
      - {id: ecfr-12-cfr-1003-appendix-c, type: regulatory, citation: "12 CFR part 1003 Appendix C (ULI check digit)", kind: ecfr_appendix, title: 12, part: 1003, appendix: "Appendix C to Part 1003", snapshot: compliance_mcp/hmda/pack/sources/12-cfr-1003-appendix-c.xml}
      - {id: ffiec-hmda-filing-instructions-guide, type: reference_data, citation: "FFIEC HMDA Filing Instructions Guide (code lists and file format)", kind: manual, url: "https://ffiec.cfpb.gov/documentation/", note: "Not scriptable (the PDF link returns 403/404). This pack encodes value domains from the regulation and Appendices B and C only; FIG code lists are NOT pinned."}
    spec_sites:

# Canonical source registry for the builder agents.
#
# For each compliance domain: where the rule text and reference data live (Federal sources),
# and where the builders go for specs (how to build the MCP server, how to explain it as an
# agent). Builders fetch these at BUILD time only; nothing fetches at loan-evaluation time.
# Re-running `python -m builders.build run` after a rule change notices which source text
# changed (normalized-text hash vs builders/sources.lock.yaml) and rebuilds ONLY the affected
# domain, bumping only that domain's component versions.
#
# source.kind:
#   ecfr_section  {title, part, section}   eCFR versioner API, text as of "up to date" date
#   url           {url, select_regex?}     any page; select_regex narrows to the stable fragment
#   manual        {url}                    not fetchable by a script (bot-blocked / no stable API);
#                                          the builder reports it and a human refreshes the snapshot
# source.snapshot: where the build stores the fetched text (inside the domain's pack).
# Only URLs that were verified reachable when this file was written are listed.

common:
  mcp_spec: {url: "https://modelcontextprotocol.io/specification/latest", note: "How MCP servers/tools are specified"}
  a2a_spec: {url: "https://a2a-protocol.org/latest/specification/", note: "How agents are exposed and discovered"}

domains:
  ybs:
    agent_key: ybs
    agent_name: "YBS Eligibility Compliance Agent"
    agent_track: "FCA Young, Beginning, and Small Farmer (YBS) Eligibility"
    authority: Farm Credit Administration (12 CFR 614)
    sources:
      - {id: ecfr-12-cfr-614-4165, type: regulatory, citation: "12 CFR 614.4165", kind: ecfr_section, title: 12, part: 614, section: "614.4165", snapshot: compliance_mcp/ybs/pack/sources/12-cfr-614-4165.xml}
    spec_sites:
      mcp: []
      agent: []
    notes: >-
      The numeric thresholds and entity-attribution method are institution policy in the pack
      (thresholds.yaml, entity_policy.yaml), not derived from the regulation text. Builders must
      never overwrite policy files from regulatory sources.

  hpml:
    agent_key: hpml
    agent_name: "HPML Compliance Agent"
    agent_track: "Higher-Priced Mortgage Loan (HPML)"
    authority: Consumer Financial Protection Bureau (Regulation Z)
    sources:
      - {id: ecfr-12-cfr-1026-35, type: regulatory, citation: "12 CFR 1026.35", kind: ecfr_section, title: 12, part: 1026, section: "1026.35", snapshot: compliance_mcp/hpml/pack/sources/12-cfr-1026-35.xml}
      - {id: fhfa-conforming-limit-2026, type: reference_data, citation: "FHFA 2026 conforming loan limit (one-unit baseline)", kind: url, url: "https://www.fhfa.gov/news/news-release/fhfa-announces-conforming-loan-limit-values-for-2026", select_regex: "2026 CLL value for one-unit properties will be \\$[0-9,]+", snapshot: compliance_mcp/hpml/pack/sources/fhfa-2026-cll-release.html}
      - {id: ffiec-apor-legacy-csv, type: reference_data, citation: "FFIEC APOR tables (legacy CSVs, 2000-01-03 to 2017-12-25)", kind: manual, url: "https://www.ffiec.gov/ratespread/aportables.htm", note: "Bot-checked from scripts; person-downloaded to compliance_mcp/hpml/sources/apor/. Frozen at 2017-12-25. See compliance_mcp/hpml/pack/APOR.md"}
      - {id: cfpb-ffiec-rate-spread-api, type: reference_data, citation: "CFPB/FFIEC HMDA Platform Rate Spread API (current APOR, 2017-01-02 onward; APOR = apr - rateSpread)", kind: manual, url: "https://ffiec.cfpb.gov/documentation/api/rate-spread/", note: "Scriptable, no key, but not yet integrated; needs a decision (compliance_mcp/hpml/pack/APOR.md)"}
    spec_sites: {mcp: [], agent: []}

  trid:
    agent_key: trid
    agent_name: "TRID Compliance Agent"
    agent_track: "TILA-RESPA Integrated Disclosure (TRID)"
    authority: Consumer Financial Protection Bureau (Regulation Z)

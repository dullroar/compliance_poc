fields:
  - match: agricultural_purpose
    rule: HMDA-COVERAGE
    route: customer
    label: farm use of the loan
    why: Regulation C may not cover a farm loan. We need to know if the customer will use this loan mainly for farm purposes.
  - match: business_commercial_purpose
    rule: HMDA-COVERAGE
    route: customer
    label: business use of the loan
    why: Regulation C may not cover a business loan. We need to know if the customer will use this loan mainly for business purposes.
  - match: loan_purpose
    rule: HMDA-COVERAGE
    route: customer
    label: loan purpose
    why: A business loan is covered only if it buys a home, improves a home or refinances. We need the purpose of the loan.
  - match: exclusions.*
    rule: HMDA-EXCL-*
    route: refer
    label: excluded-transaction check
    why: The institution must record whether the transaction type "{1}" applies.
  - match: prior_year_originations.*
    rule: HMDA-EXCL-VOLUME
    route: refer
    label: origination counts
    why: The institution must record its {1} originations for the two preceding years.
  - match: application_date
    rule: HMDA-ACTION
    route: refer
    label: application date
    why: Loan operations must record the application date to check the order of events.
  - match: apr/apor
    rule: HMDA-RATE-SPREAD
    route: refer
    label: APR and APOR
    why: Loan operations must record the APR and the APOR to compute the rate spread.
  - match: reported_rate_spread
    rule: HMDA-RATE-SPREAD
    route: refer
    label: reported rate spread
    why: Loan operations must record the rate spread that the register reports.
  - match: lar.applicant
    rule: HMDA-LAR-10
    route: customer
    label: applicant ethnicity, race and sex
    decline: true
    why: The register needs the applicant's ethnicity, race and sex. Ask; the applicant may decline; record the decline.
  - match: lar.co_applicant
    rule: HMDA-LAR-10
    route: customer
    label: co-applicant ethnicity, race and sex
    decline: true
    why: The register needs the co-applicant's ethnicity, race and sex. Ask; the co-applicant may decline; record the decline.
  - match: lar.co-applicant.*
    rule: HMDA-LAR-10
    route: refer
    label: how the co-applicant's information was collected
    why: The loan officer must record whether visual observation or surname was used.
  - match: lar.applicant.*
    rule: HMDA-LAR-10
    route: refer
    label: how the applicant's information was collected
    why: The loan officer must record whether visual observation or surname was used.
  - match: lar.age
    rule: HMDA-LAR-10
    route: customer
    label: age of the applicant
    why: The register needs the applicant's age. We use the date of birth on the application.
  - match: lar.income
    rule: HMDA-LAR-10
    route: customer
    label: gross annual income
    why: The register needs the income that we used in the credit decision. We need the gross yearly income.
  - match: lar.property_address
    rule: HMDA-LAR-09
    route: customer
    label: property address
    why: The register needs the street address of the property. We need the full address, with city, state and ZIP code.
  - match: lar.property_state
    rule: HMDA-LAR-09
    route: refer
    label: property state
    why: Loan operations must record the state of the property.
  - match: lar.property_county
    rule: HMDA-LAR-09
    route: refer
    label: property county
    why: Loan operations must record the county of the property.
  - match: lar.property_census_tract
    rule: HMDA-LAR-09
    route: refer
    label: census tract
    why: Loan operations must record the 11-digit census tract of the property.
  - match: lar.loan_purpose
    rule: HMDA-LAR-03
    route: customer
    label: purpose of the loan
    why: The register needs the purpose of the loan, such as a home purchase. We need to know what the loan is for.
  - match: lar.preapproval
    rule: HMDA-LAR-04
    route: customer
    label: preapproval request
    why: For a home purchase, the register needs to know if the customer asked for a preapproval. We need their answer.
  - match: lar.construction_method
    rule: HMDA-LAR-05
    route: customer
    label: construction method
    why: The register needs to know if the home is site-built or a manufactured home. We need the type of home.
  - match: lar.occupancy_type
    rule: HMDA-LAR-06
    route: customer
    label: how the home will be used
    why: The register needs to know if the home is a main home, a second home or an investment. We need how the customer will use it.
  - match: lar.total_units
    rule: HMDA-LAR-31
    route: customer
    label: number of units
    why: The register needs the number of units in the property. We need how many units the property has.
  - match: lar.manufactured_home_secured_property_type
    rule: HMDA-LAR-29
    route: customer
    label: manufactured home and land
    why: For a manufactured home, the register needs to know if the loan covers the home and the land. We need what the loan secures.
  - match: lar.manufactured_home_land_property_interest
    rule: HMDA-LAR-30
    route: customer
    label: land ownership
    why: For a manufactured home, the register needs how the customer holds the land. We need whether they own it or lease it.
  - match: lar.multifamily_affordable_units
    rule: HMDA-LAR-32
    route: refer
    label: affordable units
    why: The loan officer must record the number of income-restricted units in the property.
  - match: lar.loan_type_government_program
    rule: HMDA-LAR-02
    route: refer
    label: government program
    why: Loan operations must record the government insurance or guarantee program, if any.
  - match: lar.uli
    rule: HMDA-LAR-01
    route: refer
    label: universal loan identifier
    why: Loan operations must record the universal loan identifier.
  - match: lar.loan_amount
    rule: HMDA-LAR-07
    route: refer
    label: loan amount
    why: Loan operations must record the amount of the loan.
  - match: lar.purchaser_type
    rule: HMDA-LAR-11
    route: refer
    label: type of purchaser
    why: Loan operations must record who bought the loan.
  - match: lar.hoepa_status
    rule: HMDA-LAR-13
    route: refer
    label: high-cost status
    why: Loan operations must record the HOEPA status of the loan.
  - match: lar.lien_status
    rule: HMDA-LAR-14
    route: refer
    label: lien status
    why: Loan operations must record whether the lien is first or subordinate.
  - match: lar.credit_scores
    rule: HMDA-LAR-15
    route: refer
    label: credit score
    why: The credit analyst must record the credit score and the scoring model.
  - match: lar.total_loan_costs
    rule: HMDA-LAR-17
    route: refer
    label: total loan costs
    why: Closing staff must record the total loan costs from the Closing Disclosure.
  - match: lar.total_borrower_paid_charges
    rule: HMDA-LAR-18
    route: refer
    label: total borrower-paid charges
    why: Closing staff must record the total of the charges the borrower paid.
  - match: lar.discount_points
    rule: HMDA-LAR-19
    route: refer
    label: discount points
    why: Closing staff must record the discount points.
  - match: lar.lender_credits
    rule: HMDA-LAR-20
    route: refer
    label: lender credits
    why: Closing staff must record the lender credits.
  - match: lar.interest_rate
    rule: HMDA-LAR-21
    route: refer
    label: interest rate
    why: Closing staff must record the interest rate.
  - match: lar.prepayment_penalty_term_months
    rule: HMDA-LAR-22
    route: refer
    label: prepayment penalty term

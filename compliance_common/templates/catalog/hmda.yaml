# HMDA, Regulation C (12 CFR part 1003). The 38 LAR item entries follow the pinned item table (compliance_mcp/hmda/pack/lar_items.yaml).
rules:
  - match: HMDA-INSTITUTION
    kind: G
    basis: regulation
    cite: 12 CFR 1003.2(g)
    requirement: Regulation C applies only to a financial institution as defined in 1003.2(g).
    action: Record whether the institution meets the financial institution definition.
    who: loan operations
    refer: Whether the institution is a financial institution is not recorded.
  - match: HMDA-DWELLING
    kind: G
    basis: regulation
    cite: 12 CFR 1003.2(d), (o)
    requirement: A covered loan is a closed-end mortgage loan or open-end line of credit secured by a lien on a dwelling.
    action: Record whether a lien on a dwelling secures the loan.
    who: loan operations
    refer: Whether a dwelling secures the loan is not recorded.
  - match: HMDA-COVERAGE
    kind: G
    basis: regulation
    cite: 12 CFR 1003.3(c)
    requirement: A transaction is covered unless an exclusion in 1003.3(c) applies, so each exclusion must be tested and the purpose settled.
    action: Record each exclusion flag, the farm or business purpose, and the prior-year origination counts.
    who: loan officer
    refer: Coverage cannot be settled because an exclusion fact is missing or the purpose is not decided.
  - match: HMDA-EXCL-VOLUME
    kind: G
    basis: regulation
    cite: 12 CFR 1003.3(c)(11), (12)
    requirement: A loan is excluded when the institution made fewer than the minimum number of originations in one of the two preceding calendar years.
    action: Record the origination counts for the two preceding calendar years.
    who: loan operations
    refer: The origination counts for the two preceding years are missing.
  - match: HMDA-EXCL-AMOUNT
    kind: G
    basis: regulation
    cite: 12 CFR 1003.3(c)(7)
    requirement: A transaction with a total dollar amount under the pinned minimum is an excluded transaction.
    action: Record the total dollar amount of the transaction.
    who: loan operations
    refer: The total dollar amount of the transaction is missing.
  - match: HMDA-EXCL-AGRICULTURAL
    kind: G
    basis: regulation
    cite: 12 CFR 1003.3(c)(9)
    requirement: A loan used primarily for agricultural purposes is excluded from Regulation C.
    action: Record whether the loan is used primarily for agricultural purposes.
    who: loan officer
    refer: Whether the loan is used mainly for farm purposes is not decided.
  - match: HMDA-EXCL-BUSINESS
    kind: G
    basis: regulation
    cite: 12 CFR 1003.3(c)(10)
    requirement: A loan primarily for business or commercial purposes is excluded, unless it is a home purchase, home improvement or refinancing.
    action: Record the business or commercial purpose and the loan purpose.
    who: loan officer
    refer: Whether the loan is mainly for business purposes is not decided.
  - match: HMDA-EXCL-*
    kind: G
    basis: regulation
    cite: 12 CFR 1003.3(c)
    requirement: A transaction of the type "{1}" is an excluded transaction under 1003.3(c).
    action: Record whether this excluded-transaction type applies.
    who: loan operations
    refer: Whether this excluded-transaction type applies is not recorded.
  - match: HMDA-ACTION
    kind: V
    basis: regulation
    cite: 12 CFR 1003.4(a)(8)
    requirement: The action taken and its date must be recorded, and the action date may not come before the application date.
    action: Correct the action date or the application date, and record both from the loan file.
    who: loan operations
    refer: The action date comes before the application date, or the application date is missing.
  - match: HMDA-RATE-SPREAD
    kind: V
    basis: regulation
    cite: 12 CFR 1003.4(a)(12)
    requirement: The reported rate spread must equal the APR minus the APOR for a loan that is subject to Regulation Z.
    action: Record the APR and the APOR, and report the rate spread they give.
    who: loan operations
    refer: The reported rate spread differs from the APR minus the APOR, or an input is missing.
  - match: HMDA-PARTIAL-EXEMPTION
    kind: R
    basis: regulation
    cite: 12 CFR 1003.3(d)
    requirement: An institution may omit optional data only with a valid partial exemption, based on its type, its volume and its CRA rating.
    action: Record the institution type, the origination volume and the CRA rating that support the exemption, or report the optional data.
    who: compliance reviewer
    refer: The claimed partial exemption is not valid or cannot be checked.
  - match: HMDA-LAR-ITEMS
    kind: G
    basis: regulation
    cite: 12 CFR 1003.4(a)
    requirement: The register must report all 38 items of 1003.4(a) that apply; this roll-up counts the items that fail.
    action: Resolve the failing items listed with this roll-up.
    who: loan operations
    refer: Some register items fail; see each item.
  - match: HMDA-LAR-01
    kind: G
    basis: regulation
    cite: 12 CFR 1003.4(a)(1)
    requirement: The register must report universal loan identifier and application date for a covered loan, with an allowed value.
    action: Record universal loan identifier and application date from the file, or correct the value that was reported.
    who: loan operations
    refer: The register value for universal loan identifier and application date is missing or not valid.

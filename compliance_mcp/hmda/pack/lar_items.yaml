authority_note: 'All 38 numbered items of 12 CFR 1003.4(a). `optional` marks the ''optional data'' of
  1003.3(d)(1)(iii): items (a)(1)(i) [`partial`: the identifier only], (a)(9)(i) [`partial`: the street
  address only], (a)(12) and (a)(15)-(30), (a)(32)-(38). Value domains come from the regulation, Appendix
  B and Appendix C only; the FFIEC Filing Instructions Guide code lists are not pinned.'
